[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyferro"
version = "2.0.1"
description = "High-performance reactive fullstack Python framework on Rust RSGI (Granian) with symmetric WSRPC (JSON-RPC 2.0) and Tabular Data Compression."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Alex Titoff", email = "a.tit.off@gmail.com" }
]
keywords = ["pyferro", "rsgi", "granian", "wsrpc", "json-rpc", "websocket", "reactive"]
dependencies = [
    "granian>=1.6.0",
    "orjson>=3.9.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "jinja2>=3.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/atitoff-dotcom/PyFerro"
Repository = "https://github.com/atitoff-dotcom/PyFerro.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["auth*", "core*", "crud*", "db*", "files*", "rpc*", "server*", "pyferro2*"]

[tool.setuptools.package-data]
"*" = ["frontend/dist/*", "frontend/dist/**/*"]
